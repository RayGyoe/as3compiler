# Regression gate.
#
# The suite is `node test.ts`: the example end-to-end layer (compile -> link ->
# run every example under examples/) plus the unit groups in test/unit/*, both as
# node:test cases. Until now nothing ran it automatically — the 500+ assertions
# only helped when someone remembered to type the command, which is exactly how a
# broken trunk survives.
#
# Runner choice: arm64 macOS. The vendored third-party libs (vendor/sdl2,
# vendor/skia) ship macOS arm64 artifacts only and the window backends are
# Cocoa/Metal; the default link line also carries `-l iconv` (a macOS libiconv),
# which an Ubuntu runner does not provide. macos-14 is arm64 and is the faithful
# environment.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-14
    # The full example suite compiles + links + runs every example; it is minutes,
    # not seconds. A compiler regression that hangs is bounded by this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Node >= 22.18 is required: src/ is run as .ts directly through Node's
      # native type-stripping (no build step, no third-party test framework), and
      # 22.18 / 23.6 is where stripping became the DEFAULT. The published package
      # does not depend on this -- it ships pre-built dist/ JavaScript and runs on
      # Node >= 18 -- but the checkout does.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `tee` so the failure step below can read what the suite printed. `pipefail`
      # keeps node's exit code: bash on macOS is 3.2, where a pipeline's status is
      # the LAST command's, and without this a red suite would be reported green.
      - name: Full regression (examples + unit groups)
        run: |
          set -o pipefail
          node test.ts 2>&1 | tee "$RUNNER_TEMP/test.log"

      # A red run used to be an opaque "exit code 1": the run log is admin-only
      # over the REST API and node's spec reporter emits no `::error::` of its own,
      # so from outside the repo the only visible fact was that something broke.
      # Re-emit the failing case names as annotations -- those ARE readable
      # anonymously from the check run (scripts/ci-failure-annotations.ts).
      - name: Surface failures as annotations
        if: failure()
        run: node scripts/ci-failure-annotations.ts "$RUNNER_TEMP/test.log"

      # Annotations say WHICH cases failed; the full log says why. Kept on failure
      # only, so a green run downloads nothing.
      - name: Keep the regression log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: warn
